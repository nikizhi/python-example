name: Doing it for DZ DevOps
on: [push]
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run build
        run: docker build -t python-app .
      - name: Test
        run: |
          pip install pytest
          pytest -v
      - name: Ending
        run: docker run --rm python-app
